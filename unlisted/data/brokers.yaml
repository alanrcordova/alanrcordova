# Broker registry.
#
# Every entry is UNVERIFIED until `last_verified` is set: broker sites change
# their URLs and forms often. Run `unlisted verify-registry` from your own
# machine to check that each URL still resolves, then update last_verified.
#
# search_url placeholders: {first} {last} {full_slug} {city_slug} {state}
#   {state_name_slug} {phone_digits}
# optout.method: drop | email | web_form | account
# relist_days: how long after a confirmed removal to re-check.

brokers:
  - id: ca_drop
    name: California DROP (all registered data brokers)
    category: government
    optout:
      method: drop
      url: https://privacy.ca.gov/drop/
      notes: >
        One request reaches every data broker registered in California.
        Brokers must process DROP requests from Aug 1, 2026 and re-check every
        45 days. Do this first.
    relist_days: 365
    priority: 0
    last_verified: null

  - id: spokeo
    name: Spokeo
    category: people_search
    search_url: https://www.spokeo.com/{first}-{last}/{state_name_slug}/{city_slug}
    optout:
      method: web_form
      url: https://www.spokeo.com/optout
      requires: [listing_url, email]
      recipe: spokeo
    verify_domains: [spokeo.com]
    relist_days: 90
    priority: 1
    last_verified: null

  - id: whitepages
    name: Whitepages
    category: people_search
    search_url: https://www.whitepages.com/name/{first}-{last}/{city_slug}-{state}
    optout:
      method: web_form
      url: https://www.whitepages.com/suppression-requests
      requires: [listing_url, phone]
      notes: Verification is by an automated phone call.
    verify_domains: [whitepages.com]
    relist_days: 90
    priority: 1
    last_verified: null

  - id: peopleconnect
    name: PeopleConnect (Intelius, TruthFinder, Instant Checkmate, US Search, ZabaSearch)
    category: people_search
    optout:
      method: web_form
      url: https://suppression.peopleconnect.us/login
      requires: [email]
      notes: One suppression covers all PeopleConnect brands.
    verify_domains: [peopleconnect.us, intelius.com, truthfinder.com, instantcheckmate.com]
    relist_days: 90
    priority: 1
    last_verified: null

  - id: beenverified
    name: BeenVerified (also PeopleLooker, NeighborWho)
    category: people_search
    optout:
      method: web_form
      url: https://www.beenverified.com/app/optout/search
      requires: [email]
    verify_domains: [beenverified.com]
    relist_days: 90
    priority: 1
    last_verified: null

  - id: radaris
    name: Radaris
    category: people_search
    search_url: https://radaris.com/p/{first}/{last}/
    optout:
      method: web_form
      url: https://radaris.com/control/privacy
      requires: [listing_url, email]
    verify_domains: [radaris.com]
    relist_days: 60
    priority: 1
    last_verified: null

